<div class="inbox-page">

  <!-- Application Header -->
  <header class="inbox-header">
    <div class="brand">
      <div class="brand-logo">S</div>
      <div>
        <h2>Sense</h2>
        <span>Underwriting Intelligence</span>
      </div>
    </div>

    <div class="header-right">
      <span class="connection-status">
        <span class="status-dot"></span>
        Outlook Connected
      </span>
      <div class="user-avatar">UW</div>
    </div>
  </header>

  <!-- Inbox Toolbar (filters + tabs) -->
  <app-inbox-toolbar
    (searchChange)="onSearchChange($event)">
  </app-inbox-toolbar>

  <!-- Main Inbox Content (3 columns) -->
  <div class="inbox-content">

    <app-email-list
      [searchTerm]="searchTerm">
    </app-email-list>

    <app-email-viewer></app-email-viewer>

    <app-copilot-panel></app-copilot-panel>

  </div>

</div>
