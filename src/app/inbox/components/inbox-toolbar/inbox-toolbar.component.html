<div class="inbox-toolbar">

    <div class="toolbar-top">
        <input type="text" placeholder="Search sender, subject or insured" class="search-input" (input)="onSearch($any($event.target).value)"/>

        <select class="sort-select">
            <option>Newest first</option>
            <option>Highest triage score</option>
        </select>

        <span class="sync-info">
            NBSubmissions&#64;bluepond.ai · synced with Outlook
        </span>

        <button class="new-email-btn">
            ✎ New email
        </button>
    </div>

    <div class="toolbar-filters">
        <div class="filter-group">
            <label>BROKER COMPANY</label>
            <select>
                <option>All companies</option>
                <option>AmWINS</option>
                <option>Bluepond (Internal)</option>
                <option>Bridge Speciality</option>
                <option>Federato</option>
                <option>PSR LLC</option>
                <option>Velocity Risk</option>
            </select>
        </div>

        <div class="filter-group">
            <label>BROKER EMAIL</label>
            <input type="text" placeholder="name@broker.com" />
        </div>

        <div class="filter-group">
            <label>RECEIVED</label>
            <select [value]="selectedReceivedRange" (change)="onReceivedRangeChange($event)">
            
                <option value="Any time">Any time</option>
                <option value="Today">Today</option>
                <option value="Yesterday">Yesterday</option>
                <option value="Last 7 days">Last 7 days</option>
                <option value="Last 30 days">Last 30 days</option>
                <option value="Custom range...">Custom range...</option>
            
            </select>
        </div>
        <!-- Show date fields only for Custom range -->
        <div class="custom-date-range" *ngIf="showCustomDateRange">
        
            <div class="filter-group">
                <label>FROM - TO</label>
                <input type="date" />
            </div>
        
            <div class="filter-group">
                <label>&nbsp;</label>
                <input type="date" />
            </div>
        
        </div>

        <div class="filter-group attachment-filter">
            <label>ATTACHMENT TYPE</label>
            <div class="filter-chips">
                <button>SOV <span>3</span></button>
                <button>Loss runs <span>3</span></button>
                <button>Manuscript <span>2</span></button>
                <button>ACORD / app <span>6</span></button>
                <button>Other docs <span>4</span></button>
                <button>No attachments <span>2</span></button>
            </div>
        </div>
    </div>

    <nav class="ibx-tabs" id="ibTabs" role="tablist" aria-label="Email folders">
        <button role="tab" data-mtab="triage" aria-selected="false">Pending clearance<span class="n">6</span></button>
        <button role="tab" data-mtab="needs" aria-selected="false">Needs info<span class="n">4</span></button>
        <button role="tab" data-mtab="cleared" aria-selected="false">Cleared<span class="n">4</span></button>
        <button role="tab" data-mtab="other" aria-selected="false">Other mail<span class="n">2</span></button>
        <button role="tab" data-mtab="all" aria-selected="true">All<span class="n">11</span></button>
        <button role="tab" data-mtab="sent" aria-selected="false">Sent<span class="n">0</span></button>
    </nav>

</div>
